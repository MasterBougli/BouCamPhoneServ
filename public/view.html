<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>BouCamPhoneServ - Source OBS</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/shared.js" defer></script>
    <script src="/view.js" defer></script>
  </head>
  <body class="page-view">
    <main class="source-stage">
      <video id="remoteVideo" autoplay playsinline></video>
      <audio id="remoteAudio" autoplay playsinline></audio>
      <div id="sourceOverlay" class="source-overlay">
        <span class="chip good">Connecté</span>
        <span id="sourceLabel">Attente du téléphone</span>
      </div>
      <div id="placeholder" class="source-placeholder">
        <div>
          <strong>En attente du téléphone</strong>
          <span>La source OBS se connecte automatiquement dès qu’un mobile commence à diffuser.</span>
        </div>
      </div>
    </main>
  </body>
</html>
